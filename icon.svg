<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none" role="img" aria-label="Prompt Studio">
  <!--
    Transparent, hollow, line-only artwork: no fill anywhere.

    The card frame around this file is `.fO69Vq_cardIcon`, and `PackageArtwork`
    renders the manifest icon through an <img> element — an isolated document that
    cannot read the page's `currentColor`. A pure-black stroke would therefore be
    invisible on a dark card, and a `prefers-color-scheme` switch inside the file
    tracks the OS scheme, not the application's theme attribute. One neutral ink
    that reads on both surfaces is the only correct choice here.
  -->
  <g stroke="#7d858f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="27" height="27" rx="7.5" />
    <path d="M18 9.6c0.62 4.7 2.82 6.9 7.52 7.52-4.7 0.62-6.9 2.82-7.52 7.52-0.62-4.7-2.82-6.9-7.52-7.52 4.7-0.62 6.9-2.82 7.52-7.52Z" />
  </g>
</svg>
